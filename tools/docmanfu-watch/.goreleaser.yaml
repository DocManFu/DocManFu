version: 2

project_name: docmanfu

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: docmanfu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: docmanfu
    repository:
      owner: DocManFu
      name: homebrew-docmanfu
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/DocManFu/DocManFu"
    description: "Watch a directory and auto-upload new files to a DocManFu instance"
    license: "MIT"
    install: |
      bin.install "docmanfu"
    test: |
      system "#{bin}/docmanfu", "--help"
