# Runs as the image's non-root user, so everything nginx writes goes to /tmp
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # .mjs not in default mime.types
    types {
        application/javascript mjs;
    }

    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile    on;
    tcp_nopush  on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server_tokens off;

    # HSTS only when served over HTTPS (directly or via a TLS-terminating proxy)
    map $http_x_forwarded_proto $hsts_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $hsts_proto $hsts_header {
        https   "max-age=31536000";
        default "";
    }

    # Reverse proxies allowed to set the client IP (empty by default, so
    # X-Forwarded-For can't be spoofed). See docs/DEPLOYMENT.md.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/trusted-proxies.conf;

    # Brute-force protection for credential endpoints (per client IP)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers live in a snippet because add_header in a
        # location block drops every header inherited from the server block
        include /etc/nginx/security-headers.conf;

        # FastAPI's Swagger/ReDoc pages load their JS/CSS from jsDelivr
        location ~ ^/api/(docs|redoc)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security $hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

            resolver 127.0.0.11 valid=10s;
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoints that check a password or sign in — rate limited, otherwise identical to /api/.
        # /refresh is exempt: it needs a signed token, so there's nothing to brute-force
        location ~ ^/api/auth/(login|setup|change-password|passkeys/login/(options|verify)|passkeys/register/options)$ {
            limit_req zone=auth burst=10 nodelay;

            resolver 127.0.0.11 valid=10s;
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE — the JWT travels in the query string, so keep it out of logs
        location = /api/events {
            access_log off;

            resolver 127.0.0.11 valid=10s;
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
        }

        # API proxy — SSE support with proxy_buffering off
        location /api/ {
            # Re-resolve DNS so container IP changes don't cause 502s
            resolver 127.0.0.11 valid=10s;
            set $upstream_api http://api:8000;

            client_max_body_size 2048m;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;

            # WebSocket support (future-proofing)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static assets with cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # SPA fallback — serve index.html for client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
